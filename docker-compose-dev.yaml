name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_CLIENTS=5
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
    
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - CLI_NOMBRE=ALAN
      - CLI_APELLIDO=KAY
      - CLI_DOCUMENTO=123
      - CLI_NACIMIENTO=1940-05-17
      - CLI_NUMERO=7574
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data:/.data
    
  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
      - CLI_NOMBRE=DAN
      - CLI_APELLIDO=INGALLS
      - CLI_DOCUMENTO=456
      - CLI_NACIMIENTO=1944-01-01
      - CLI_NUMERO=1234
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data:/.data
    
  client3:
    container_name: client3
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=3
      - CLI_NOMBRE=ADELE
      - CLI_APELLIDO=GOLDBERG
      - CLI_DOCUMENTO=789
      - CLI_NACIMIENTO=1945-07-07
      - CLI_NUMERO=5678
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data:/.data
    
  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - CLI_NOMBRE=LINUS
      - CLI_APELLIDO=TORVALDS
      - CLI_DOCUMENTO=012
      - CLI_NACIMIENTO=1969-12-28
      - CLI_NUMERO=9012
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data:/.data
    
  client5:
    container_name: client5
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=5
      - CLI_NOMBRE=GUIDO
      - CLI_APELLIDO=VAN ROSSUM
      - CLI_DOCUMENTO=345
      - CLI_NACIMIENTO=1956-01-31
      - CLI_NUMERO=3456
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data:/.data
    
networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24